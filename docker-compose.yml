services:

  # ── SoundCloud Playlist Scraper (Python) ──────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: karisik-scraper
    restart: unless-stopped
    networks:
      - default
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Port dışarıya açılmıyor — sadece app servisi erişir
    expose:
      - "5001"

  # ── Ana uygulama (Node.js) ────────────────────────────────────────────────
  app:
    build: .
    container_name: karisik-kaset
    restart: unless-stopped
    init: true
    depends_on:
      - scraper
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # Scraper adresi: Docker iç ağında servis adıyla erişilir
      SCRAPER_HOST: scraper
      SCRAPER_PORT: 5001
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - default
      - web_proxy
    volumes:
      - ./data:/app/data
      - ./config/stations.json:/app/config/stations.json
      - ./config/tracks.json:/app/config/tracks.json
      - ./config/tapes:/app/config/tapes

networks:
  web_proxy:
    external: true
